name: cs_launcher_hosting
description: CS LAUNCHER HOSTING - Host Minecraft servers from your Android device with free tunnels, full customization, plugins and live console.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
